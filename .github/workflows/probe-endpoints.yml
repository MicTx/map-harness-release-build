name: Gitea SSH endpoint probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Probe endpoints
        shell: bash
        env:
          GITEA_DEPLOY_KEY: ${{ secrets.GITEA_DEPLOY_KEY }}
        run: |
          set -u
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          umask 077
          printf '%s\n' "$GITEA_DEPLOY_KEY" > "$work/key"
          chmod 600 "$work/key"
          for hp in "git.mxk.dev 22" "git.mxk.dev 2222" "cq10.dpfrp.top 22" "cq10.dpfrp.top 2222"; do
            host="${hp%% *}"; port="${hp##* }"
            echo "===== $host:$port ====="
            echo "-- keyscan --"
            ssh-keyscan -T 15 -p "$port" -t ed25519 "$host" 2>&1 | tee "$work/kh.$port" || true
            if [ -s "$work/kh.$port" ]; then ssh-keygen -lf "$work/kh.$port" || true; fi
            echo "-- ssh banner --"
            GIT_SSH_COMMAND="ssh -i '$work/key' -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=no -p $port" \
              ssh -T "git@$host" 2>&1 | head -5 || true
            echo "-- ls-remote --"
            GIT_SSH_COMMAND="ssh -i '$work/key' -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=no -p $port" \
              git ls-remote "git@$host:mxk/map-harness.git" refs/heads/main 2>&1 | head -5 || true
          done
