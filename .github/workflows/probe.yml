name: Public runner probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Runner check
        shell: pwsh
        run: |
          Write-Output "runner=$env:ImageOS image=$env:ImageVersion"
          Write-Output "public repo actions are running"
