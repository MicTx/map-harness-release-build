name: Gitea SSH 2222 detail
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: SSH detail
        shell: bash
        env:
          GITEA_DEPLOY_KEY: ${{ secrets.GITEA_DEPLOY_KEY }}
        run: |
          set -u
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          umask 077
          printf '%s\n' "$GITEA_DEPLOY_KEY" > "$work/key"
          chmod 600 "$work/key"
          for port in 22 2222; do
            echo "===== port $port verbose ====="
            ssh -vvv -T -p "$port" -i "$work/key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=no git@git.mxk.dev 2>&1 | grep -E 'Remote protocol|Server host key|Authentications|Offering|Server accepts|Permission|banner|kex|Connection|debug1: Local version' | head -30 || true
            echo "===== port $port plain ====="
            ssh -T -p "$port" -i "$work/key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=no git@git.mxk.dev 2>&1 | head -5 || true
          done
